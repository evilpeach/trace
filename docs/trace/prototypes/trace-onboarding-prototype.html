const baseLabel=()=>S().base==='stacked'?'feature/chart-orders':'main';
function setTheme(value){theme=value;document.documentElement.dataset.theme=value==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):value;render()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(theme==='system')setTheme(theme)});
function deliverables(){return `<div class="deliverable">${I('file')}<div><strong>Every file, explained</strong><p>What changed, why it matters, and where to look.</p></div></div><div class="deliverable">${I('flow')}<div><strong>The complete journey</strong><p>Follow behavior across files, before and after.</p></div></div><div class="deliverable">${I('flag')}<div><strong>Evidence you can inspect</strong><p>Findings connected to exact source lines.</p></div></div>`}
function comparison(){return `<div class="comparison"><div class="comparison-grid"><div><div class="compare-label">Base · ${S().base==='stacked'?'stacked PR #338':'selected branch'}</div><div class="compare-value mono">${baseLabel()}</div></div><div class="compare-arrow">${I('arrow')}</div><div><div class="compare-label">Reviewing · ${S().target==='pr'?'PR #341':'current branch'}</div><div class="compare-value mono">feature/chart-pills</div></div></div><div class="comparison-foot">${I('info')}<span>${S().base==='stacked'?'11 changed files · compares only this layer of the PR stack.':'Comparison changed. File count would be resolved before a real run.'}</span></div></div>`}
function focusField(){return `<label class="field">Anything to pay attention to? <span class="muted small">Optional · the full change is still covered</span><textarea data-field="focus" placeholder="e.g. Check how dragging a pill updates the order price.">${esc(S().focus)}</textarea></label>`}
function projectChoice(){return `<div class="stack"><button class="choice ${S().project?'selected':''}" data-action="select-project"><span class="avatar">S</span><span><strong>orbit-web</strong><p>orbit-chart-pills</p><p class="mono">feature/chart-pills</p></span>${S().project?I('check'):''}</button>${action('add-project',`${I('plus')} Connect another repository`,'btn quiet')}</div>`}
function targetFields(){return `<div class="twocol"><button class="choice ${S().target==='pr'?'selected':''}" data-action="target-pr"><span class="radio"></span><span><strong>Pull request</strong><p>Use the PR’s comparison.</p></span></button><button class="choice ${S().target==='branch'?'selected':''}" data-action="target-branch"><span class="radio"></span><span><strong>Current branch</strong><p>Choose a base branch.</p></span></button></div><div style="margin-top:18px">${S().target==='pr'?'<label class="field">Pull request<input aria-label="Pull request URL" data-field="url" value="https://github.com/example-org/orbit-web/pull/341"><small>Prototype recognizes the bundled PR #341 example.</small></label>':'<div class="note">Using the selected worktree’s branch: <code>feature/chart-pills</code></div>'}</div><label class="field">Compare against<select data-field="base" aria-label="Base branch"><option value="stacked" ${S().base==='stacked'?'selected':''}>feature/chart-orders · stacked base</option><option value="main" ${S().base==='main'?'selected':''}>main · broader comparison</option></select></label>${comparison()}`}
function methods(){return `<div class="stack"><button class="choice ${S().method==='native'?'selected':''}" data-action="method-native"><span class="radio"></span><span><strong>Generate in Trace</strong><p>Use a connected coding agent. Follow progress here.</p></span><span class="tag">Simulated</span></button><button class="choice ${S().method==='external'?'selected':''}" data-action="method-external"><span class="radio"></span><span><strong>Use my existing agent</strong><p>Take a prepared request to your agent. Trace detects the report.</p></span></button></div>`}
function submit(label){return action('generate',`${I(S().method==='native'?'spark':'arrow')} ${label||(S().method==='native'?'Generate report':'Prepare review request')}`,'btn primary')}
function VariantA(){const s=S();return `<div class="content wizard"><div class="intro"><div class="eyebrow">Create your first review</div><h1>A clear path from code to context.</h1><p>Choose the change. Your agent explains it. Trace brings the story and its evidence together.</p></div><div class="steps">${['Project','Changes','Create report'].map((x,i)=>`${i?'<div class="step-line"></div>':''}<button class="step ${s.step===i+1?'current':s.step>i+1?'done':''}" data-step="${i+1}" ${s.step<i+1?'disabled':''}><b>${s.step>i+1?'✓':i+1}</b>${x}</button>`).join('')}</div><div class="wizard-layout"><section class="wizard-main">${s.step===1?`<h2>Where does your code live?</h2><p>Choose a project and worktree. We’ll remember it for your next review.</p>${projectChoice()}<div class="wizard-actions">${action('import','Import an existing report','link')}${action('next',`Continue ${I('arrow')}`,'btn primary',s.project?'':'disabled')}</div>`:s.step===2?`<h2>Which change should we review?</h2><p>Check the base so this report covers the right scope.</p>${targetFields()}<div class="wizard-actions">${action('back',`${I('left')} Back`)}${action('next',`Continue ${I('arrow')}`,'btn primary')}</div>`:`<h2>How would you like to create it?</h2><p>Both paths produce the same review, ready to explore in Trace.</p>${methods()}<div style="margin-top:20px">${focusField()}</div><div class="note">${I('branch')} <strong>PR #341</strong> · ${s.base==='stacked'?'11 changed files':'comparison needs resolving'}<br><span class="small">Base: ${baseLabel()}</span></div><div class="wizard-actions">${action('back',`${I('left')} Back`)}${submit()}</div><div class="footer-note">${I('info')} Interactive preview. No agent will run.</div>`}</section><aside class="preview-aside"><div class="eyebrow">Your report will include</div>${deliverables()}<div class="rule"></div><p class="small">No findings is a valid result. File explanations and journeys are useful either way.</p></aside></div></div>`}
function VariantB(){const s=S();return `<div class="content composer-wrap"><div class="intro"><div class="eyebrow">A little context. The whole picture.</div><h1>What would you like to understand?</h1><p>Turn a pull request into file explanations, connected flows, and findings you can inspect.</p></div><section class="composer" aria-label="New review composer"><div class="composer-project">${action('project-picker',`${I('folder')} ${s.project?'orbit-web':'Choose a project'} ${I('down')}`,'project-chip')}<span class="spacer"></span><span class="tag">New review</span></div><div class="row between"><div><div class="composer-target">${I('branch')}<strong>${s.target==='pr'?'PR #341 · TP/SL chart pills':'Review the current branch'}</strong></div><p class="composer-sub">${s.target==='pr'?'example-org / orbit-web':'feature/chart-pills'}</p></div>${action('edit-target',s.edit?'Done':'Change','btn compact quiet')}</div>${s.edit?`<div class="inline-editor">${targetFields()}</div>`:comparison()}<textarea aria-label="Optional review focus" data-field="focus" placeholder="Anything specific to look at? Optional.">${esc(s.focus)}</textarea><div class="composer-bottom"><label class="method-select">${I(s.method==='native'?'spark':'terminal')}<select aria-label="Generation method" data-field="method"><option value="native" ${s.method==='native'?'selected':''}>Generate in Trace</option><option value="external" ${s.method==='external'?'selected':''}>Use my agent</option></select></label>${s.method==='native'?'<span class="tag">Simulated agent</span>':''}<span class="spacer"></span>${submit(s.method==='native'?'Create review':'Prepare request')}</div></section><div class="footer-note">${I('info')} ${s.method==='native'?'Prototype only. Generation is simulated; your source is untouched.':'Trace prepares the instructions. You run them in your coding agent.'}</div><div class="included"><div>${I('file')}<h3>Every changed file</h3><p>A useful TLDR beside its diff.</p></div><div>${I('flow')}<h3>The main journey</h3><p>Follow the change across files.</p></div><div>${I('flag')}<h3>Grounded findings</h3><p>Inspect the code behind each claim.</p></div></div><div class="quiet-actions">${action('example','Explore an example','link')}${action('import','Import a report','link')}</div></div>`}
function VariantC(){const s=S();return `<div class="content project-home"><div class="project-heading"><span class="avatar">S</span><div><h1>orbit-web</h1><p>One project. Every review, in context.</p></div><span class="spacer"></span>${action('project-picker',`${I('folder')} Worktree`,'btn compact')}</div><div class="project-tabs"><span class="active">Overview</span><span>Reviews <span class="tag">0</span></span><span>Activity</span></div><div class="project-grid"><div class="stack"><section class="card white"><div class="row between"><h3>Ready for your first review</h3><span class="tag">2 of 3</span></div><div class="checklist-row finished"><span class="circle">${I('check')}</span><div><strong>Project connected</strong><p>orbit-web · selected worktree</p></div></div><div class="checklist-row finished"><span class="circle">${I('check')}</span><div><strong>Change selected</strong><p>PR #341 · TP/SL chart pills<br>${s.base==='stacked'?'11 changed files against stacked PR #338':'Base changed to main · scope needs resolving'}</p></div></div><div class="checklist-row"><span class="circle">3</span><div><strong>Create your report</strong><p>Use a connected agent or take the request to your own.</p></div></div></section><section class="project-empty">${I('inbox')}<h3>A home for every review</h3><p>Reports and new versions appear here. Pick up where you left off, with your reading progress intact.</p>${action('example','See an example review','link')}</section></div><aside class="create-panel"><div class="panel-head"><h3>New review</h3><p class="small" style="margin:6px 0 0">Start with the current pull request.</p></div><div class="panel-body"><div class="label-line"><span>PR #341 · TP/SL chart pills</span>${action('edit-target','Change','link')}</div>${s.edit?targetFields():comparison()}<label class="field">Create with<select data-field="method"><option value="native" ${s.method==='native'?'selected':''}>In Trace · simulated agent</option><option value="external" ${s.method==='external'?'selected':''}>My existing agent</option></select></label>${focusField()}<div class="small muted">Includes all file TLDRs, the main journey, and verified findings.</div>${submit()}<div class="footer-note">${I('info')} Prototype · no agent will run</div></div></aside></div></div>`}
const phases=['Prepare the comparison','Analyze files and connected flows','Check evidence and validate report'];
function activity(){const s=S();const external=s.screen==='waiting';const ready=s.screen==='ready';const failed=s.screen==='failed';const cancelled=s.screen==='cancelled';const title=external?'Your request is ready':ready?'Your review is ready':failed?'The report needs attention':cancelled?(s.method==='external'?'Import cancelled':'Generation cancelled'):s.method==='external'?'Checking your report':'Creating your review';return `<div class="content"><section class="activity"><div class="activity-head"><span class="activity-symbol">${I(ready?'check':external?'terminal':failed?'flag':cancelled?'close':'refresh',s.screen==='running'?'spin':'')}</span><div><h1>${title}</h1><p>orbit-web · PR #341 · TP/SL chart pills</p></div></div><section class="card white"><div class="job-top row between"><div><strong style="font-size:14px">${external?'Use your existing coding agent':ready?'Orbit · TP/SL chart pills':'Review activity'}</strong><div class="small muted" style="margin-top:5px">${external?'Trace is waiting for a completed report.':'Base aaaaaaaa → head bbbbbbbb'}</div></div><span class="tag ${ready?'success':failed?'warning':''}">${ready?'Ready':external?'Waiting':failed?'Needs attention':cancelled?'Cancelled':s.method==='external'?'Validating · simulated':'Running · simulated'}</span></div>${external?`<div class="wait-instructions"><div class="wait-item"><b>1</b><div>Copy the prepared request.<p>Includes the project, comparison, output location, and report instructions.</p></div></div><div class="wait-item"><b>2</b><div>Run it in your coding agent.<p>Use the selected Orbit worktree. Trace does not control the external session.</p></div></div><div class="wait-item"><b>3</b><div>Return here when it finishes.<p>Trace checks the report and adds it to this project.</p></div></div></div><div class="note"><span class="small">Expected report</span><br><code>.trace/chart-pills.trace.json</code></div><div class="job-controls" style="margin-top:20px">${action('request',`${I('copy')} View & copy request`,'btn primary')}${action('check',`${I('refresh')} Check now`)}${action('import','Import manually','btn quiet')}</div><div class="prototype-actions"><span>Preview controls</span>${action('report-arrived','Simulate report arrival','btn compact')}${action('fail','Simulate invalid report','btn compact')}</div>`:ready?`<p>The bundled Orbit example is ready to explore. These are saved report results, not a review performed by this prototype.</p><div class="ready-stats"><div><strong>11</strong><span>file explanations</span></div><div><strong>3</strong><span>connected flows</span></div><div><strong>1</strong><span>reported finding</span></div></div><div class="note">Source inspection and runtime testing are distinct. The example records its verification limits.</div><div class="job-controls" style="margin-top:24px">${action('open-report',`Open review ${I('arrow')}`,'btn primary')}${action('new','Create another','btn quiet')}</div>`:failed?`<h3 style="margin-bottom:12px">One source reference could not be validated.</h3><p>This simulated report points outside the selected head snapshot. It has not been added to your reviews.</p><div class="note"><code>flows[0].after.nodes[2].evidence</code><br>Ask your agent to recheck the line range against head bbbbbbbb.</div><div class="job-controls" style="margin-top:23px">${action('repair',`${I('copy')} View repair instructions`,'btn primary')}${action('retry','Try again')}${action('new','Back to setup','btn quiet')}</div>`:cancelled?`<p>The simulated run has stopped. Your project and previous reports are still available.</p><div class="job-controls">${action('retry','Start again','btn primary')}${action('new','Back to setup')}</div>`:`<div class="job-steps">${phases.map((x,i)=>s.method==='external'&&i<2?'':`<div class="job-step ${i<s.job?'complete':i===s.job?'active':''}"><span class="job-mark">${i<s.job?'✓':s.method==='external'?1:i+1}</span><span>${x}</span>${i===s.job?'<span class="tag" style="margin-left:auto">In progress</span>':''}</div>`).join('')}</div><div class="note">${s.method==='external'?'A simulated completed report has arrived. Trace checks the comparison and source references before importing it.':'Previewing the proposed in-app runner. No code is being read and no agent is executing.'}</div><div class="job-controls" style="margin-top:22px">${action('cancel',s.method==='external'?'Cancel import':'Cancel generation')}${action('background','Keep browsing','btn quiet')}</div><div class="prototype-actions"><span>Preview controls</span>${action('advance',s.job===2?'Finish validation':'Advance stage','btn compact')}${action('fail','Simulate failure','btn compact')}</div>`}</section><div class="footer-note">${I('folder')} Activity stays with this project; leaving the page does not lose it.</div></section></div>`}
function report(){const s=S();return `<div class="content"><div class="eyebrow">Example report · saved snapshot</div><div class="row between"><h1>Orbit · TP/SL chart pills</h1>${action('new',`${I('refresh')} Generate update`,'btn')}</div><p class="small" style="margin-top:12px">PR #341 · 11 changed files · 3 flows · <code>bbbbbbbb</code></p><div class="report-tabs">${['overview','files','flows','findings'].map(x=>`<button data-view="${x}" class="${s.view===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}${x==='files'?' · 11':x==='flows'?' · 3':x==='findings'?' · 1':''}</button>`).join('')}</div>${s.view==='overview'?`<div class="tour-note"><strong>Start here.</strong> Read the main journey, then follow a step into its code.</div><div class="report-hero">TP/SL orders gain chart pills, a separate pencil action, and live drag-price previews.</div><p>The review connects what changed to its source. One supported finding concerns an overfull pill layout.</p><div class="rule"></div><div class="row between"><h3>The main journey</h3>${action('show-flows','Explore flow →','link')}</div>${journey()}<div class="rule"></div><span class="tag warning">P2 · Medium</span><h3 style="margin:13px 0">An overfull pill stack can hide too many orders.</h3><p class="small">The report records source evidence and an exact-source reproduction. Real TradingView browser acceptance remains unverified.</p>`:s.view==='flows'?`<h2>Read clustered TP/SL orders on the chart</h2><p style="margin-top:12px">A shortened preview of the saved main journey.</p>${journey()}<div class="tour-note">In the app, selecting a step opens the committed code beside this flow.</div>`:s.view==='files'?`<h2>Every change has a place.</h2><div class="report-row">${I('file')}<div><strong>ChartLineOverlay.tsx</strong><p>Lay out neighboring pills and lift fitting stacks inside the pane.</p></div></div><div class="report-row">${I('file')}<div><strong>11 changed files in the saved report</strong><p>Open Trace for the complete inventory, TLDRs, and committed diffs.</p></div></div>`:`<span class="tag warning">P2 · Medium</span><h2 style="margin-top:17px">Start an overfull pill stack at the pane top</h2><p style="margin-top:16px">When the entire stack cannot fit, retaining its original starting position can waste space above it and hide extra orders.</p><div class="note">This is the existing report’s finding. Severity is not a sequence number or a newly generated assessment.</div>`}</div>`}
function journey(){return `<div class="journey"><div class="journey-step"><small>01 · INPUT</small>Read the TP/SL order state</div>${I('arrow')}<div class="journey-step"><small>02 · LAYOUT</small>Place and stack chart pills</div>${I('arrow')}<div class="journey-step"><small>03 · OUTCOME</small>See nearby orders on the chart</div></div>`}
function home(){if(!activities[variant])return `<div class="content"><div class="eyebrow">orbit-web</div><h1>Make room for your first review.</h1><p style="margin-top:13px">Create a report for a pull request or branch. Each review and its updates will appear in this project.</p><div class="job-controls" style="margin-top:24px">${action('new',`${I('plus')} Create first review`,'btn primary')}${action('import','Import a report')}</div></div>`;return `<div class="content"><div class="eyebrow">orbit-web</div><h1>Your review workspace</h1><p style="margin-top:13px">Carry on while your review is being prepared.</p><section class="card" style="max-width:700px;margin-top:30px"><div class="row between"><div><h3>PR #341 · TP/SL chart pills</h3><p class="small" style="margin:7px 0 0">${activities[variant]?.screen==='ready'?'Report ready':activities[variant]?.screen==='waiting'?'Waiting for your external agent’s report':'Review activity · simulated'}</p></div>${action('return-job','View activity →','btn primary')}</div></section><div class="tour-note">This project activity card is the recommended destination after creating a review in any variant.</div></div>`}
function render(){const s=S();if(['running','waiting','ready','failed','cancelled'].includes(s.screen))activities[variant]={...s};if(s.screen==='report')activities[variant]={...s,screen:'ready'};const labels={A:'Guided setup',B:'Quick composer',C:'Project workspace'};document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand">${I('logo')} Trace</div>${action('new',`${I('plus')} New review`,'nav '+(s.screen==='create'?'active':''))}${action('inbox',`${I('inbox')} Review inbox`,'nav')}<div class="sidebar-label">Projects ${action('add-project',I('plus'),'iconbtn','aria-label="Add project"')}</div><button class="project-title" data-action="project-home">${I('down')}${I('folder')} orbit-web</button><div class="project-item">${activities[variant]?action('return-job',`${I('clock')} PR #341<br><span class="small">${activities[variant]?.screen==='waiting'?'Waiting for report':activities[variant]?.screen==='ready'?'Report ready':'Review activity'}</span>`,'','style="text-align:left"'):'<span>PR #341</span><br><span class="small">Create your first report</span>'}</div><div class="side-bottom">${action('how',`${I('info')} How reports work`,'nav')}${action('settings',`${I('gear')} Settings`,'nav')}<div class="side-note">Design exploration · v0.1</div></div></aside><main class="shell"><header class="titlebar"><span>orbit-web</span><span>/</span><span class="crumb">${s.screen==='create'?'New review':s.screen==='report'?'PR #341':s.screen==='home'?'Project':'Review activity'}</span><span class="spacer"></span><span class="tag prototype-badge">Interactive prototype</span><select aria-label="Appearance" id="appearance"><option value="dark" ${theme==='dark'?'selected':''}>Dark</option><option value="light" ${theme==='light'?'selected':''}>Light</option><option value="system" ${theme==='system'?'selected':''}>System</option></select></header><div class="canvas">${s.screen==='create'?(variant==='A'?VariantA():variant==='B'?VariantB():VariantC()):s.screen==='report'?report():s.screen==='home'?home():activity()}</div></main></div><div class="state-line" aria-live="polite">${labels[variant]} · ${s.screen==='create'&&variant==='A'?'Step '+s.step:s.screen} · Project: ${s.project?'Orbit':'none'} · ${s.target==='pr'?'PR #341':'branch'} · Base: ${s.base==='stacked'?'stacked':'main'} · ${s.method==='native'?'in-app simulation':'external handoff'}${s.focus?' · focus added':''}</div><nav class="dock" aria-label="Prototype variants">${action('variant-prev',I('left'),'iconbtn','aria-label="Previous variant"')}${variants.map(v=>`<button class="variant-btn ${v===variant?'on':''}" data-variant="${v}" aria-pressed="${v===variant}"><b>${v}</b>${labels[v]}</button>`).join('')}${action('variant-next',I('right'),'iconbtn','aria-label="Next variant"')}<div class="divider"></div>${action('reset',I('refresh'),'iconbtn','aria-label="Reset this variant"')}${action('compare',`${I('info')} <span class="hide-small">Compare</span>`,'btn quiet compact')}</nav>`}
function toast(text){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',4000)}
function modal(title,body){opener=document.activeElement;document.getElementById('modal').innerHTML=`<div class="modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2>${action('close',I('close'),'iconbtn','aria-label="Close dialog"')}</div>${body}</section></div>`;document.querySelector('.modal button')?.focus()}
function closeModal(){document.getElementById('modal').innerHTML='';if(opener?.isConnected)opener.focus()}
function setVariant(v){variant=v;const url=new URL(location);url.searchParams.set('variant',v);history.replaceState(null,'',url);closeModal();render()}
function requestText(){return `DESIGN PROTOTYPE — example request, not a configured generation job.\n\nCreate a Trace review for orbit-web PR #341.\nWorktree: orbit-chart-pills\nBase: ${S().base==='stacked'?'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa':'main (must resolve before a real run)'}\nHead: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\nOutput: .trace/chart-pills.trace.json\n\nExplain all changed files, put the main end-to-end journey first, and connect findings to verified source evidence. Zero findings is valid. Preserve review identity on updates. Do not edit source or reviewer progress.\n${S().focus?'Additional focus: '+S().focus+'\n':''}\nIn the implemented app, this request will include the exported report toolkit path and validation instructions. These resources are not exported by this HTML prototype.`}
function doAction(id){const s=S();switch(id){
case'new':states[variant]={...initial(),method:s.method,focus:s.focus};render();break;
case'reset':states[variant]=initial();activities[variant]=null;render();toast('This variant is back at its starting point.');break;
case'variant-prev':setVariant(variants[(variants.indexOf(variant)+2)%3]);break;
case'variant-next':setVariant(variants[(variants.indexOf(variant)+1)%3]);break;
case'next':s.step=Math.min(3,s.step+1);render();break;
case'back':s.step=Math.max(1,s.step-1);render();break;
case'select-project':s.project=true;render();break;
case'target-pr':s.target='pr';render();break;
case'target-branch':s.target='branch';render();break;
case'method-native':s.method='native';render();break;
case'method-external':s.method='external';render();break;
case'edit-target':s.edit=!s.edit;render();break;
case'project-picker':case'add-project':modal('Choose a project',`<p>One project can include several local worktrees. This prototype uses the connected Orbit example.</p>${projectChoice()}<div class="rule"></div><div class="note">Prototype: folder selection and project registration are simulated.</div>${action('use-project','Use this worktree','btn primary')}`);break;
case'use-project':s.project=true;closeModal();render();toast('Orbit worktree selected for this preview.');break;
case'generate':if(['running','waiting'].includes(activities[variant]?.screen)){modal('A review is already in progress',`<p>Your existing activity is still available. Finish or cancel it before starting another run for this project.</p>${action('return-job','Return to review activity','btn primary')}`);break}if(!s.project){doAction('project-picker');break}if(s.base!=='stacked'){modal('Preview scope',`<p>The bundled report covers PR #341 against stacked PR #338. A real review against main would need a newly resolved comparison and new analysis.</p>${action('use-stacked','Use the bundled stacked comparison','btn primary')}`);break}s.screen=s.method==='external'?'waiting':'running';s.job=0;render();break;
case'use-stacked':s.base='stacked';closeModal();doAction('generate');break;
case'advance':s.job++;if(s.job>=3)s.screen='ready';render();break;
case'report-arrived':s.screen='running';s.job=2;render();toast('Simulated report found. Advance validation to view the result.');break;
case'fail':s.screen='failed';render();break;
case'cancel':s.screen='cancelled';render();break;
case'retry':s.screen=s.method==='external'?'waiting':'running';s.job=0;render();break;
case'background':s.returnScreen=s.screen;s.screen='home';render();break;
case'return-job':closeModal();if(activities[variant])states[variant]={...activities[variant]};else s.screen='create';render();break;
case'check':toast('No report is being generated here. Use “Simulate report arrival” to continue.');break;
case'open-report':case'example':s.screen='report';s.view='overview';render();break;
case'show-flows':s.view='flows';render();break;
case'project-home':case'inbox':s.returnScreen=['running','waiting','ready','failed','cancelled'].includes(s.screen)?s.screen:s.returnScreen;s.screen='home';render();break;
case'request':modal('Prepared review request',`<p>This is an example of the complete handoff. The app will supply an accessible report toolkit; users won’t need Trace’s source repository.</p><textarea id="copy-text" readonly aria-label="Example prepared request">${esc(requestText())}</textarea>${action('copy-demo',`${I('copy')} Copy demo request`,'btn primary')}`);break;
case'repair':modal('Repair instructions',`<p>A real validation failure would produce precise instructions for the same comparison.</p><textarea id="copy-text" readonly aria-label="Example repair instructions">PROTOTYPE: Recheck the invalid source reference in flows[0].after.nodes[2].evidence against head bbbbbbbb. Correct the anchor, validate the whole report, and publish a completed report atomically. Preserve report and entity IDs. Do not edit source code or reviewer progress.</textarea>${action('copy-demo','Copy demo instructions','btn primary')}`);break;
case'copy-demo':{const text=document.getElementById('copy-text').value;if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Demo text copied.')).catch(()=>{document.getElementById('copy-text').select();toast('Select and copy the text above.')})}else{document.getElementById('copy-text').select();toast('Select and copy the text above.')} break}
case'import':modal('Import an existing report',`<p>Already have a report? In the app you can choose a <code>.trace.json</code> file. Here, try the bundled example.</p><div class="card"><h3>Orbit · TP/SL chart pills</h3><p class="small" style="margin-top:8px">11 file explanations · 3 flows · 1 reported finding</p></div>${action('load-import','Preview imported report','btn primary')}`);break;
case'load-import':closeModal();s.screen='ready';render();break;
case'how':modal('From a change to a clear review',`<div class="reason-row"><h3>1. Choose the changes</h3><p>Pick a project and a PR or branch. Confirm the comparison, including stacked PR bases.</p></div><div class="reason-row"><h3>2. Your agent creates the report</h3><p>Run a connected agent in Trace, or take a prepared request to your own coding agent. In-app execution is a proposed feature, simulated here.</p></div><div class="reason-row"><h3>3. Trace helps you review it</h3><p>Explore file summaries, cross-file journeys, and source evidence. Your decisions and progress stay separate from the report.</p></div>`);break;
case'settings':modal('Prototype settings',`<p>Use the appearance selector in the top bar to try Light, Dark, or System. The prototype uses the app’s native system font at a readable 15 px.</p><div class="note">All choices stay in memory. No application settings or reports are changed.</div>`);break;
case'compare':modal('Which flow is smoothest?',`<div class="reason-row"><h3>A · Guided setup</h3><p>Clearest for someone who wants explicit instruction. One decision at a time, but more Continue/Back navigation on repeat reviews.</p></div><div class="reason-row"><h3>B · Quick composer <span class="tag accent">Recommended</span></h3><p>Shows the change, comparison, and action together. Good defaults make the common case short; editable details stay close by.</p></div><div class="reason-row"><h3>C · Project workspace</h3><p>Strong project context and visible setup. More to scan before creating a report; better as the home for ongoing activity.</p></div><div class="note" style="margin-top:20px">Recommended direction: B for creation, C’s persistent activity card after submission, and a short contextual setup step when a project or agent is missing. This is a design judgment, not a usability-study result.</div>`);break;
case'close':closeModal();break;
}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-variant]');if(v){setVariant(v.dataset.variant);return}const st=e.target.closest('[data-step]');if(st){S().step=+st.dataset.step;render();return}const vw=e.target.closest('[data-view]');if(vw){S().view=vw.dataset.view;render();return}const a=e.target.closest('[data-action]');if(a)doAction(a.dataset.action);else if(e.target.classList.contains('modal-bg'))closeModal()});
document.addEventListener('input',e=>{if(e.target.dataset.field==='focus')S().focus=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='appearance')setTheme(e.target.value);if(e.target.dataset.field==='method'){S().method=e.target.value;render()}if(e.target.dataset.field==='base'){S().base=e.target.value;render()}if(e.target.dataset.field==='url'&&!/\/pull\/341\/?$/.test(e.target.value)){toast('This prototype uses the saved PR #341 example.');e.target.value='https://github.com/example-org/orbit-web/pull/341'}});
document.addEventListener('keydown',e=>{const dialog=document.querySelector('.modal');if(dialog){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const els=[...dialog.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();doAction(e.key==='ArrowLeft'?'variant-prev':'variant-next')}});
render();
</script>
</body>
</html>
