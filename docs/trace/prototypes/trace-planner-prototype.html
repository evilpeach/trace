h pinned repository context.','Show waiting, invalid, retry and revision-change states honestly.','Record acceptance of one revision; export a scoped implementation brief.'],gate:'Artifact arrival does not imply acceptance. Copying a brief does not run code or mark tasks complete.'},{id:5,title:'Connect implementation to review',sub:'Check actual behavior against accepted intent.',depends:'04 · Create and hand off',files:'components/planner/PlanValidation.tsx (proposed) · plans.rs · report/plan association state',steps:['Associate an actual review snapshot with an accepted plan revision.','Attach evidence to criteria, including failed and unknown outcomes.','Exercise one real plan-to-review case, then ship behind Planner preview.'],gate:'A criterion becomes supported only with actual evidence. Existing reviewer progress and checkpoints survive.'}];

function flowsView(){return `<div class="split"><section class="vstack"><div><div class="section-kicker">Behavior, not just boxes</div><h2>${state.diagram==='journey'?'From intention to a verified outcome':'A new workflow on familiar foundations'}</h2><p class="mini mt">${state.diagram==='journey'?'Actor: a developer planning a change. Trigger: an idea before implementation. Outcome: an agreed plan that can be checked against code.':'The project shell and review reader remain existing foundations. Planner adds distinct content and state ownership.'}</p></div><div><div class="graphbar"><div class="seg" aria-label="Diagram type"><button data-diagram="journey" class="${state.diagram==='journey'?'active':''}">User flow</button><button data-diagram="architecture" class="${state.diagram==='architecture'?'active':''}">Architecture</button></div>${state.diagram==='journey'?`<div class="seg" aria-label="Flow revision">${[['compare','Compare'],['before','Current'],['after','Proposed']].map(([id,l])=>`<button data-revision="${id}" class="${state.revision===id?'active':''}">${l}</button>`).join('')}</div>`:''}</div>${state.diagram==='journey'?`<div class="graphbar"><label class="mini">Scenario <select aria-label="Flow scenario" id="scenario" class="btn"><option value="happy" ${state.scenario==='happy'?'selected':''}>Valid plan → implementation</option><option value="invalid" ${state.scenario==='invalid'?'selected':''}>Invalid artifact → recovery</option><option value="baseline" ${state.scenario==='baseline'?'selected':''}>Baseline changed → reassess</option></select></label><span class="mini" style="color:var(--muted)">Select a node to inspect</span></div>`:''}<div class="graphcanvas">${state.diagram==='journey'?journeyGraph():architectureGraph()}</div><div class="graph-caption legend"><span><i class="gray"></i>Solid · observed / existing</span><span><i class="purple"></i>Dashed · proposed</span><span>Fit to available width · scroll on small screens</span></div></div><details class="card card-pad"><summary>Read the flow as text</summary><p class="mini mt">Current: implement → select a PR or branch comparison → review code. Proposed: describe goal → inspect committed baseline → explore plan → resolve decisions and accept revision → implement externally → verify criteria in a linked review.</p><p class="mini mt">Invalid proposal: retain the last valid plan and request correction. Baseline moved: keep the old snapshot pinned, reassess impact, and create a new revision when needed.</p></details><div class="note"><strong>Current vs proposed is a product distinction.</strong> Current nodes can have source evidence. Proposed nodes link to planned changes and acceptance criteria; they do not imply future code exists.</div></section><aside class="rail">${detail()}${scopeMini()}</aside></div>`}
function scopeView(){const filtered=capabilities.filter(c=>state.filter==='all'||c.kind===state.filter);return `<div class="split"><section class="vstack"><div><div class="section-kicker">Bound the change</div><h2>Extend Trace without rewriting its review model.</h2><p class="mini mt">Six capability groups. The exact file inventory is a follow-up of implementation planning; proposed paths are labeled.</p></div><div class="metrics"><div class="metric"><b>3</b><small>New capability groups</small></div><div class="metric"><b>3</b><small>Existing groups extended</small></div><div class="metric"><b>Separate</b><small>Plan & review contracts</small></div></div><div><div class="graphbar"><h3>Planned change inventory</h3><div class="seg">${[['all','All 6'],['new','New 3'],['extend','Extend 3']].map(([id,l])=>`<button data-filter="${id}" class="${state.filter===id?'active':''}">${l}</button>`).join('')}</div></div><div class="card tablewrap"><table class="table"><thead><tr><th>Capability</th><th>Change</th><th>Planned work</th></tr></thead><tbody>${filtered.map(c=>`<tr><td><strong>${c.name}</strong><p>${c.detail}</p><code class="codepath">${c.file}</code></td><td><span class="pill ${c.kind==='new'?'blue':'purple'}">${c.kind==='new'?'Add':'Extend'}</span></td><td><button data-task="${c.task}">Package 0${c.task} →</button></td></tr>`).join('')}</tbody></table></div></div><div class="two"><div class="card card-pad"><h3>Preserve</h3><ul class="list"><li>Existing .trace.json reports</li><li>Review decisions and checkpoints</li><li>Projects, appearance and safe text</li><li>External-agent provider selection</li></ul></div><div class="card card-pad"><h3>Defer</h3><ul class="list"><li>Autonomous implementation</li><li>Work-in-progress source snapshots</li><li>Team approval roles and collaboration</li><li>Scheduling and issue-tracker sync</li></ul></div></div></section><aside class="rail">${scopeMini()}${detail()}</aside></div>`}
function roadmap(){return `<div class="roadmap">${tasks.map(t=>`<button data-task="${t.id}" class="${t.id===3?'parallel':''}"><b>0${t.id}</b>${['Contract','Import & state','Workspace','Create & agree','Link review'][t.id-1]}</button>`).join('')}</div>`}
function dependencyGraph(){return `<svg viewBox="0 0 700 215" aria-label="Work dependencies: 1 precedes 2 and 3; 2 and 3 precede 4; 4 precedes 5" role="group">${defs}${edge('M143 104H167V58H192')}${edge('M167 104V155H192')}${edge('M342 58H372V104H399')}${edge('M342 155H372V104')}${edge('M542 104H567')}${svgNode('task1',5,71,'01 · Contract','Start here',138,false)}${svgNode('task2',192,25,'02 · Import & state','After 01',150,false)}${svgNode('task3',192,122,'03 · Workspace','Fixture work after 01',150,false)}${svgNode('task4',399,71,'04 · Create & agree','Requires 02 + 03',143,false)}${svgNode('task5',567,71,'05 · Link review','Requires 04',128,false)}<text class="svg-sub" x="192" y="210">03 can start with fixtures; native integration requires 02.</text></svg>`}
function implementationView(){return `<div class="split"><section class="vstack"><div><div class="section-kicker">From agreement to action</div><h2>Five slices, each with a clear exit gate.</h2><p class="mini mt">This is a proposed sequence. Nothing has been implemented or marked complete.</p></div><div class="graphcanvas">${dependencyGraph()}</div><div class="phases">${tasks.map(t=>`<article class="phase"><button class="phase-head" data-phase="${t.id}" aria-expanded="${state.phase===t.id}"><span class="num">0${t.id}</span><div><h3>${t.title}</h3><p>${t.sub}</p></div><span class="pill">${state.phase===t.id?'−':'Details +'}</span></button>${state.phase===t.id?`<div class="phase-body"><p><strong>Depends on:</strong> ${t.depends}</p><ol>${t.steps.map(s=>`<li style="margin:8px 0">${s}</li>`).join('')}</ol><div class="gate"><strong>Exit gate</strong><br>${t.gate}</div><div class="detail-label">Proposed implementation targets</div><code>${t.files}</code></div>`:''}</article>`).join('')}</div><div class="two"><div class="card card-pad"><h3>Rollout</h3><p class="mini mt">Preview entry → fixture walkthrough → one real Trace change → plan-to-review acceptance → release.</p></div><div class="card card-pad"><h3>Rollback</h3><p class="mini mt">Hide Planner and disable plan discovery. Retain plan artifacts and local history; keep Reviews working.</p></div></div><div class="note">No delivery dates or effort percentages are asserted. Sequence follows dependencies; estimates can be added with explicit rationale.</div></section><aside class="rail">${detail()}<div class="rail-card"><h3>First useful milestone</h3><p>Complete 01–03 to import and understand a plan. Add 04–05 to create one in Trace and verify the result.</p><div class="rule"></div>${goto('Check success criteria','validation')}</div></aside></div>`}
function decisionCard(id,title,body,options){return `<article class="decision"><div class="decision-top"><div><div class="section-kicker">${id.toUpperCase()} / BLOCKING DESIGN DECISION</div><h3>${title}</h3></div><span class="pill ${state.decisions[id]?'green':'amber'}">${state.decisions[id]?'Resolved':'Open'}</span></div><p>${body}</p>${options.map(([value,label,note])=>`<label class="choice ${state.choices[id]===value?'chosen':''}"><input type="radio" name="${id}" data-choice="${id}" value="${value}" ${state.choices[id]===value?'checked':''} ${state.accepted?'disabled':''}><span><strong>${label}</strong><small>${note}</small></span></label>`).join('')}${!state.accepted?`<button class="btn ${state.decisions[id]?'':'soft'}" data-resolve="${id}">${state.decisions[id]?'Reopen decision':'Use selected direction'}</button>`:''}</article>`}
function decisionsView(){return `<div class="split"><section class="vstack"><div><div class="section-kicker">Make the tradeoffs visible</div><h2>Resolve the questions that shape implementation.</h2><p class="mini mt">Recommendations are proposed defaults. Your choices belong to the accepted revision.</p></div>${decisionCard('d1','How should plans be represented?','Plans have one observed baseline and a hypothetical future. Reviews compare two existing snapshots.',[['separate','Separate plan contract · recommended','Keep review imports compatible and give proposals explicit semantics. Adds a second validator.'],['shared','Generalize the review contract','A single envelope, but requires a migration strategy for every existing review consumer.']])}${decisionCard('d2','Which source should a plan describe?','The baseline should be reproducible when the plan is read or handed off later.',[['committed','Committed baseline in V1 · recommended','Pin a commit. Explain excluded working-tree edits. Reuse current source validation.'],['working','Capture working-tree snapshots too','Covers unfinished edits, but expands storage, privacy and source identity requirements.']])}<div class="card card-pad"><h3>Known risks and assumptions</h3><ul class="list"><li><strong>Proposed can look verified.</strong> Keep visible labels and different evidence rules.</li><li><strong>A refresh can erase agreement.</strong> Preserve immutable revisions and acceptance history.</li><li><strong>Graph reuse may be coupled to base/head.</strong> Prove one baseline-only inspector before extracting shared code.</li><li><strong>Too many screens can slow understanding.</strong> Lead with a narrative overview and progressive detail.</li></ul></div></section><aside class="rail">${readiness()}<div class="rail-card"><h3>A choice can change the plan</h3><p>Choosing an alternative triggers “Changes requested” in this demo. The proposed tasks and criteria need a revised artifact before acceptance.</p></div></aside></div>`}
function validationView(){return `<div class="split"><section class="vstack"><div><div class="section-kicker">What would prove this worked?</div><h2>Success is observable behavior.</h2><p class="mini mt">These are planned checks. No implementation evidence is attached to this prototype.</p></div><div class="card tablewrap"><table class="table"><thead><tr><th>Criterion</th><th>How to check</th><th>Evidence</th></tr></thead><tbody>${criteria.map(([id,title,desc,method])=>`<tr id="${id}" style="${state.criterion===id?'background:var(--bluebg)':''}"><td><code>${id}</code><br><strong>${title}</strong><p>${desc}</p></td><td>${method}</td><td><span class="pill">Not run</span></td></tr>`).join('')}</tbody></table></div><div class="card card-pad"><div class="section-line"><h3>Link the eventual implementation</h3><span class="pill">No review linked</span></div><p class="mini">After implementation, associate the actual repository comparison with this accepted plan revision. Check each criterion using review evidence; record deviations and unknowns explicitly.</p><button class="btn mt" data-action="link-review">Preview review connection →</button></div><div class="note"><strong>Acceptance is agreement, not verification.</strong> A copied brief is not proof of execution. A missing finding is not proof that a problem was fixed.</div></section><aside class="rail">${readiness()}<div class="rail-card"><h3>Revision safety</h3><p>Acceptance belongs to one revision. New plan content or affected source needs reassessment.</p><div class="rule"></div>${btn('Simulate baseline change','stale','w-full')}<div style="height:8px"></div>${btn('Preview next revision','revision','w-full')}</div></aside></div>`}
function reviewView(){return `<div class="review-empty"><span class="pill">EXISTING WORKFLOW / CONTEXT PREVIEW</span><h2>Reviews inspect what was built.</h2><p>Keep Trace's current code review workspace alongside Planner. The new connection is the ability to compare an actual implementation with an accepted plan's intent.</p><div class="review-preview"><div>${icon('grid')}<br>Overview</div><div>${icon('scope')}<br>Files</div><div>${icon('flow')}<br>Flows</div><div>${icon('review')}<br>Findings</div></div><div class="card card-pad"><div class="section-line"><h3>Accepted plan</h3><span class="pill">${state.accepted?'Demo revision accepted':'No accepted revision yet'}</span></div><p class="mini">${esc(state.title)} · 8 criteria ready to be checked when a real comparison exists.</p><div class="mt">${btn('Return to Planner','return','soft')}</div></div><p class="mini mt">This panel illustrates workspace coexistence. It does not load or simulate an actual code review.</p></div>`}
function render(){const focused=document.activeElement;const focusAttrs=focused?.dataset?Object.entries(focused.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())}="${CSS.escape(v)}"]`).join(''):'';const focusSelector=focusAttrs?(focused.tagName.toLowerCase()+focusAttrs+(focused.type==='radio'?`[value="${CSS.escape(focused.value)}"]`:'')):null;let scroll=$('.scroll')?.scrollTop||0;const view=state.section==='overview'?({A:overviewA,B:overviewB,C:overviewC,D:overviewD,E:overviewE}[state.variant]||overviewD)():({flows:flowsView,scope:scopeView,implementation:implementationView,decisions:decisionsView,validation:validationView}[state.section]||overviewA)();$('#app').innerHTML=`<div class="shell">${sidebar()}<main class="workspace"><div class="topbar"><div class="crumb"><span>Trace</span><span>/</span><strong>${state.mode==='planner'?'Planner':'Reviews'}</strong><span class="pill">Design prototype</span></div><div class="toolbar"><a class="btn" href="../planner-plan.html">${icon('book')} Product plan</a><button class="iconbtn" data-action="theme" aria-label="Switch to ${state.theme==='light'?'dark':'light'} theme">${icon('moon')}</button><button class="btn" data-action="settings">${icon('settings')}Settings</button><button class="btn" data-action="new">${icon('plus')}New plan</button></div></div><div class="scroll">${state.mode==='planner'?header():''}<div class="body">${state.mode==='planner'?staleBanner()+view:reviewView()}<div class="demo-state">DEMO STATE · ${state.variant} / ${state.mode} / ${state.section}${state.variant==='D'?' / '+state.lens+' / '+state.lensDepth:state.variant==='E'?' / package 0'+state.deliveryTask:''} · ${status()} · ${state.checks.size}/3 read · ${Object.keys(state.decisions).length}/2 decisions · plan state in memory · layout preference saved separately</div></div></div></main></div>`;$('.scroll').scrollTop=scroll;if(focusSelector)document.querySelector(focusSelector)?.focus({preventScroll:true});}
function notify(msg){$('#toast').textContent=msg;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').textContent='',4500)}
function modal(title,body,actions=''){const d=$('#modal');d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>${actions?`<div class="modal-actions">${actions}</div>`:''}`;if(!d.open)d.showModal();}
function handoffText(){return `TRACE PLANNER — ILLUSTRATIVE IMPLEMENTATION BRIEF\nPlan: ${state.title}\nRevision: ${state.revisionNumber} (${state.accepted?'accepted in this browser demo':'draft; not accepted'})\nObserved baseline: ef3ea6e666c95631c1a06433f605b0a8a423e690\n\nGoal: Add a Planner workflow beside Reviews to explain motivation, current/proposed behavior, scope, implementation and success criteria.\n\nSequence:\n${tasks.map(t=>`${t.id}. ${t.title}\n   Dependencies: ${t.depends}\n   Exit gate: ${t.gate}`).join('\n')}\n\nDecisions: Separate plan contract; committed baseline for V1; retain all five layouts with D as default and a saved Settings preference.\nBoundaries: Preserve existing review reports and user progress. Proposed content must not imply verified future code. No autonomous implementation in Planner.\n\nAcceptance:\n${criteria.map(c=>c[0]+': '+c[2]).join('\n')}\n\nThis export is a design demonstration, not a production plan artifact or instruction to run an agent. Read the accompanying PLANNER-PLAN.md for the complete proposal. No code, tests, or native actions have run from this page.`;}
function openAction(a){if(a==='settings'){openLayoutSettings();return}if(a==='default-layout'){openLayoutSettings(DEFAULT_LAYOUT);return}if(a==='save-layout'){saveLayout(state.pendingLayout);return}if(a==='close'){$('#modal').close();return}if(a==='theme'){state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;render();return}if(a==='return'){state.mode='planner';render();return}if(a==='inspector'){state.expandedInspector=!state.expandedInspector;render();return}if(a==='new'){modal('Start with the intent',`<p>Preview the compact New plan composer. Your brief changes the heading and context; the body remains the “Add Planner to Trace” sample.</p><label class="field">Project<input value="Trace / pr-review-navigator" readonly></label><label class="field">What should change?<input id="new-title" maxlength="100" value="${esc(state.title)}"></label><label class="field">Why does this matter?<textarea id="new-why" placeholder="Describe the problem and desired outcome">${esc(state.customBrief||'Understand and agree on a change before implementation starts.')}</textarea></label><label class="field">Constraints<textarea id="new-constraints">Preserve the existing review workflow. Make proposed and verified behavior distinct.</textarea></label><div class="note">Baseline: <code>ef3ea6e</code> · committed snapshot.<br>In the real workflow, this brief is handed to an external planning agent. This prototype only previews the form.</div>`,btn('Cancel','close')+btn('Preview this brief','create','primary'));return}if(a==='create'){const title=$('#new-title').value.trim();if(!title){$('#new-title').focus();return}state.title=title;state.customBrief=$('#new-why').value.trim()+' Constraints: '+$('#new-constraints').value.trim();state.accepted=false;state.stale=false;state.revisionNumber=1;state.selected='p1';state.choices={d1:'separate',d2:'committed'};state.decisions={};state.checks=new Set();state.mode='planner';state.section='overview';$('#modal').close();render();$('.scroll').scrollTop=0;notify('Brief captured in memory. The proposal body remains the illustrative sample.');return}if(a==='baseline'){modal('A pinned, observed baseline',`<p>This design was prepared from the repository at:</p><div class="request">ef3ea6e666c95631c1a06433f605b0a8a423e690</div><p class="mt">Observed: comparison-based creation, Overview/Files/Flows/Findings, before/after source evidence, project history and external-agent requests.</p><p>Proposed: a baseline-only plan contract, Planner reader, revision acceptance and links to later implementation reviews.</p><div class="note">The HTML does not inspect your current checkout. “Repository advanced” is a controllable demo state.</div>`,btn('Simulate baseline change','stale')+btn('Done','close','primary'));return}if(a==='stale'){state.stale=true;$('#modal').close();render();notify('Simulated: repository advanced. The plan baseline stays pinned.');return}if(a==='refresh'||a==='revision'){modal('Keep the agreement in history',`<p>A new revision should summarize changes and ask for agreement again. The previously accepted revision stays in history.</p><div class="note"><strong>Preview next revision</strong><br>Revision ${state.revisionNumber} → ${state.revisionNumber+1}<br>Acceptance: cleared for new content<br>Reading acknowledgments and decisions: reset in this demo<br>Baseline impact: simulated as reassessed; no Git command runs</div>`,btn('Keep current revision','close')+btn('Preview new revision','next-revision','primary'));return}if(a==='next-revision'){state.revisionNumber++;state.stale=false;state.accepted=false;state.checks=new Set();state.decisions={};state.choices={d1:'separate',d2:'committed'};$('#modal').close();render();notify('New demo revision. Agreement must be recorded again; no native history was written.');return}if(a==='accepted-info'){modal('Agreement recorded in this demo',`<p>Revision ${state.revisionNumber} is accepted in memory. This means the proposal is agreed, not implemented or verified.</p><div class="note">A future native app stores acceptance separately from the agent-authored plan and binds it to the artifact digest.</div>`,btn('Close','close')+btn('Preview handoff','handoff','primary'));return}if(a==='accept'){const ready=state.checks.size===3&&Object.keys(state.decisions).length===2&&!state.stale;modal(ready?'Accept this revision':'This plan needs a decision',ready?`<p>Record agreement with revision ${state.revisionNumber}, its scope, decisions, and success criteria. Implementation still happens separately.</p><div class="note">Prototype only. This action changes local demo state and does not authorize or launch an agent.</div>`:`<p>Before acceptance, read the required sections, resolve the two blocking decisions, and address changed baseline context.</p><div class="factrow"><span>Required sections read</span><strong>${state.checks.size} / 3</strong></div><div class="factrow"><span>Decisions resolved</span><strong>${Object.keys(state.decisions).length} / 2</strong></div><div class="factrow"><span>Baseline context</span><strong>${state.stale?'Needs refresh':'Demo baseline pinned'}</strong></div>`,btn('Close','close')+(ready?btn('Accept revision '+state.revisionNumber,'confirm-accept','primary'):btn('Go to decisions','go-decisions','primary')));return}if(a==='go-decisions'){state.section='decisions';$('#modal').close();render();$('.scroll').scrollTop=0;return}if(a==='confirm-accept'){state.accepted=true;$('#modal').close();render();notify('Revision accepted in this demo. Implementation and verification remain separate.');return}if(a==='handoff'){const ready=state.accepted&&!state.stale;modal(ready?'Implementation handoff':'Draft handoff preview',`<p>${ready?'The brief carries the accepted scope, task dependencies, and success criteria. Copying it does not launch an agent.':'This plan is not ready for an implementation handoff. You can inspect the draft; copying is enabled after acceptance and baseline reassessment.'}</p><pre class="request" id="request-copy">${esc(handoffText())}</pre><p class="mini mt">Demo export includes the sample proposal, not a native machine-readable artifact.</p>`,btn('Close','close')+`<button class="btn primary" data-action="copy" ${ready?'':'disabled'}>${icon('copy')}Copy brief</button>`);return}if(a==='copy'){const text=handoffText();navigator.clipboard?.writeText(text).then(()=>notify('Illustrative brief copied. No agent has been launched.')).catch(()=>selectCopy());if(!navigator.clipboard)selectCopy();return}if(a==='link-review'){modal('Verify the result against intent',`<p>A future review association identifies the repository, exact review generation, accepted plan revision and checked criteria.</p><div class="card card-pad"><div class="section-kicker">No implementation review available</div><h3>All 8 criteria are not run.</h3><p class="mini mt">Once code exists, choose its actual review snapshot and attach evidence to each criterion. Supported, failed and unavailable remain separate outcomes.</p></div><div class="note mt">This preview cannot pick a real review, fabricate evidence, or mark the proposal verified.</div>`,btn('Close','close','primary'));return}}
function selectCopy(){const range=document.createRange();range.selectNodeContents($('#request-copy'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);notify('Brief selected. Press ⌘C or Ctrl+C to copy.');}

 D:'<rect x="3" y="4" width="21" height="30"/><rect x="29" y="4" width="21" height="30"/><path d="M7 13h13M7 19h13M33 13h13M33 19h13"/>',

};return `<svg class="layout-thumbnail" viewBox="0 0 54 38" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">${shapes[id]}</svg>`}
function openLayoutSettings(selected=state.variant){state.pendingLayout=selected;modal('Settings',`<div class="section-kicker">Planner</div><h3>Overview layout</h3><p class="layout-help">Choose how you read a plan. All five layouts use the same plan, decisions, and detailed sections.</p><fieldset class="layout-options"><legend class="sr-only">Planner overview layout</legend>${Object.entries(variants).map(([id,label])=>`<label class="layout-option"><input type="radio" name="planner-layout" value="${id}" ${state.pendingLayout===id?'checked':''}>${layoutThumbnail(id)}<span><strong>${id} · ${label}${id===DEFAULT_LAYOUT?' <span class="pill blue">Default</span>':''}</strong><small>${layoutDescriptions[id]}</small></span></label>`).join('')}</fieldset><p class="layout-storage">Saved for future visits in this browser. Your plan content and reading progress stay the same.</p>`,`<button class="btn" data-action="default-layout">Use default (D)</button><span style="flex:1"></span>${btn('Cancel','close')}${btn('Save layout','save-layout','primary')}`)}
function saveLayout(value){if(!validLayout(value))return;let persisted=true;try{localStorage.setItem(LAYOUT_PREFERENCE_KEY,value)}catch{persisted=false}state.variant=value;const url=new URL(location.href);url.searchParams.delete('variant');try{history.replaceState({},'',url)}catch{}$('#modal').close();render();notify(persisted?`Planner layout saved: ${variants[value]}.`:`Layout changed to ${variants[value]} for this session. This browser prevented saving the preference.`)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-section],[data-inspect],[data-task],[data-phase],[data-mode],[data-diagram],[data-revision],[data-filter],[data-resolve],[data-criterion],[data-lens],[data-lens-depth],[data-delivery]');if(!el)return;const d=el.dataset;if(d.lens){state.lens=d.lens;state.selected=changeLenses[d.lens].problem;render();return}if(d.lensDepth){state.lensDepth=d.lensDepth;render();return}if(d.delivery){state.deliveryTask=Number(d.delivery);state.selected='task'+d.delivery;render();return}if(d.action){openAction(d.action);return}if(d.criterion){state.criterion=d.criterion;state.section='validation';render();document.getElementById(d.criterion)?.scrollIntoView({block:'center'});return}if(d.section){state.section=d.section;state.mode='planner';render();$('.scroll').scrollTop=0;return}if(d.mode){state.mode=d.mode;render();return}if(d.inspect){state.selected=d.inspect;state.expandedInspector=true;render();return}if(d.task){state.phase=Number(d.task);state.selected='task'+d.task;state.section='implementation';render();$('.scroll').scrollTop=0;return}if(d.phase){state.phase=state.phase===Number(d.phase)?0:Number(d.phase);state.selected='task'+d.phase;render();return}if(d.diagram){state.diagram=d.diagram;render();return}if(d.revision){state.revision=d.revision;render();return}if(d.filter){state.filter=d.filter;render();return}if(d.resolve){if(state.decisions[d.resolve]){delete state.decisions[d.resolve];render();return}if((d.resolve==='d1'&&state.choices.d1!=='separate')||(d.resolve==='d2'&&state.choices.d2!=='committed')){modal('This choice changes the proposal',`<p>The sample work packages assume a separate plan contract and a committed baseline. Your alternative requires a revised contract, migration scope, and validation plan.</p><div class="note">Changes requested · this decision remains unresolved. In the native workflow, send the chosen direction back to the planning agent and compare the revised proposal before accepting.</div>`,btn('Keep exploring','close','primary'));return}state.decisions[d.resolve]=state.choices[d.resolve];render();notify('Decision resolved in this demo revision.');}});
document.addEventListener('change',e=>{const el=e.target;if(el.name==='planner-layout'){state.pendingLayout=el.value;return}if(el.dataset.check){el.checked?state.checks.add(el.dataset.check):state.checks.delete(el.dataset.check);render()}if(el.dataset.choice){state.choices[el.dataset.choice]=el.value;delete state.decisions[el.dataset.choice];render()}if(el.id==='scenario'){state.scenario=el.value;state.revision='compare';render()}});
document.addEventListener('keydown',e=>{if(e.target.matches('svg [data-inspect]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.selected=e.target.dataset.inspect;render();return}});
render();
