<body>
<div class="studio">
  <header class="study-bar">
    <span class="study-brand">Trace / Design lab</span>

      <button class="quiet" data-action="guide">What changed?</button>

  </section>
</div>

<dialog id="dialog"><div id="dialog-content"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>

const projects=[{id:'strat',name:'strat-web-app',initial:'S',description:'Trading interface'},{id:'kit',name:'interwovenkit',initial:'I',description:'Wallet connection toolkit'},{id:'trace',name:'trace',initial:'T',description:'Code review workspace'}];
const reviews=[
{id:'331',project:'strat',number:331,title:'TP/SL trigger input',status:'progress',pinned:true,files:19,journeys:2,findings:1,reviewed:1,reports:2,branch:'peach/multi-tpsl-trigger-input',hash:'b5fadb44',summary:'Express a TP/SL target as a price, leveraged percent, or dollar amount.',file:'src/constants/localStorage.ts',why:'Remember the selected gain unit between sessions.'},
{id:'332',project:'strat',number:332,title:'Multi-TP/SL data layer',status:'done',files:12,journeys:3,findings:0,reviewed:12,reports:1,branch:'peach/multi-tpsl-data',hash:'ae38d84',summary:'Give multiple protection orders a shared data model.',file:'src/types/protection.ts',why:'Keep order data consistent across the ticket and chart.'},
{id:'333',project:'strat',number:333,title:'TP/SL trading commands',status:'new',files:9,journeys:2,findings:1,reviewed:0,reports:1,branch:'peach/multi-tpsl-commands',hash:'8ab155f',summary:'Connect protection order actions to trading commands.',file:'src/commands/protection.ts',why:'Keep command inputs aligned with the order model.'},
{id:'338',project:'strat',number:338,title:'Edit TP/SL from chart lines',status:'updated',files:15,journeys:3,findings:1,reviewed:8,reports:3,branch:'peach/multi-tpsl-chart',hash:'c9781cd',summary:'Edit an individual protection order from its chart line.',file:'src/chart/orderLines.ts',why:'Carry the selected order into the editor.'},
{id:'341',project:'strat',number:341,title:'TP/SL chart pills',status:'progress',files:11,journeys:3,findings:1,reviewed:4,reports:2,branch:'peach/multi-tpsl-chart-pill',hash:'21be4fd',summary:'Read and edit protection orders through chart pills.',file:'src/chart/orderPills.ts',why:'Keep chart actions close to the order they affect.'},
{id:'344',project:'strat',number:344,title:'Group crowded chart orders',status:'new',files:7,journeys:2,findings:0,reviewed:0,reports:1,branch:'peach/multi-tpsl-grouped-pills',hash:'8513783',summary:'Group chart orders when labels would overlap.',file:'src/chart/pillLayout.ts',why:'Make a dense chart easier to scan.'},
{id:'261',project:'kit',number:261,title:'Persist auto-sign preference',status:'new',files:8,journeys:2,findings:1,reviewed:0,reports:1,branch:'peach/autosign-preference',hash:'82f7de1',summary:'Keep signing preferences scoped to the selected account.',file:'src/preferences.ts',why:'Restore the expected preference after reconnecting.'},
{id:'259',project:'kit',number:259,title:'Signing readiness',status:'done',files:5,journeys:2,findings:0,reviewed:5,reports:2,branch:'peach/signing-readiness',hash:'a72cd02',summary:'Check readiness before the next signing request.',file:'src/signing.ts',why:'Make preparation explicit before a request.'},
{id:'trace-main',project:'trace',number:null,title:'Header and user journeys',status:'progress',files:41,journeys:2,findings:0,reviewed:6,reports:1,branch:'main',hash:'5e21ea4',summary:'Give reviews a compact header and explicit main journeys.',file:'src/components/ReviewHeader.tsx',why:'Leave more room for source code and diagrams.'}
];
const statusNames={new:'New',updated:'Updated',progress:'In progress',done:'Done'};
const reviewCount=n=>n+' '+(n===1?'review':'reviews');
const designs={
A:{name:'Project library',tag:'Recommended starting point',desc:'Familiar projects, one row per review. A simpler hierarchy with room to grow.',benefit:'Keep projects visible and remove the extra PR → snapshot layer.',tradeoff:'Large projects need search or a “Show all” action.'},
B:{name:'Focused project',tag:'Best for deep work',desc:'Choose a project once, then work through a flat list of its reviews.',benefit:'Readable review titles with almost no nesting.',tradeoff:'Activity in other projects is less visible.'},
C:{name:'Review queue',tag:'Best for daily triage',desc:'Organize by what needs attention across projects, rather than by repository.',benefit:'Answer “What should I review next?” immediately.',tradeoff:'Rows move between queues as their status changes.'},
D:{name:'Project rail',tag:'Fastest project switching',desc:'A narrow project rail and a dedicated review drawer keep each level separate.',benefit:'Jump between projects with one click; collapse the drawer for code.',tradeoff:'Project initials take longer to recognize than full names.'},
E:{name:'Stack navigator',tag:'Best for stacked PRs',desc:'Group related PRs into a visible review order, with project context above.',benefit:'Keep multi-PR features and their intended sequence together.',tradeoff:'Requires saved stack relationships; this grouping is a proposal.'}
};
const keys=Object.keys(designs);
const initial=new URL(location.href).searchParams.get('variant');
const state={variant:keys.includes(initial)?initial:'A',selected:'331',project:'strat',expanded:new Set(['strat']),showAll:new Set(),filter:'all',queue:'progress',scope:'all',query:'',collapsed:false,section:'files',snapshot:'latest',theme:'light',archived:new Set(),stackOpen:true};
const selected=()=>reviews.find(r=>r.id===state.selected);
const projectBy=id=>projects.find(p=>p.id===id);
const visibleReviews=()=>reviews.filter(r=>!state.archived.has(r.id));
const projectReviews=id=>visibleReviews().filter(r=>r.project===id);
const attention=()=>visibleReviews().filter(r=>r.status==='new'||r.status==='updated');
function button(action,text,iconName,cls='nav-item',extra=''){return '<button class="'+cls+'" data-action="'+action+'" '+extra+'>'+ (iconName?icon(iconName):'')+text+'</button>';}
function brand(){return '<div class="brandline">'+icon('logo','trace-mark')+'<b>Trace</b>'+button('collapse','','panel','icon-btn','aria-label="Collapse sidebar" title="Collapse sidebar (⌘B)"')+'</div>';}
function newReview(){return button('new','New review <kbd>⌘N</kbd>','plus','new-review left');}
function searchButton(){return button('search','Search reviews <kbd>⌘K</kbd>','search','search-button');}
function foot(rail=false){return '<footer class="side-foot">'+button('activity','Agent activity <span class="waiting">2 waiting</span>','clock','request-link')+'<div class="foot-tools">'+button('settings','','settings','icon-btn','title="Settings" aria-label="Settings"')+button('help','','help','icon-btn','title="Help and report instructions" aria-label="Help and report instructions"')+button('import','','upload','icon-btn','title="Import a report" aria-label="Import a report"')+'<span class="spacer"></span>'+button('archive',rail?'Archive':'Archived','','quiet')+'</div></footer>';}
function row(r,opts={}){return '<button class="review-row '+(opts.queue?'queue-row':'')+'" data-action="review" data-id="'+r.id+'" '+(r.id===state.selected?'aria-current="page"':'')+' title="'+esc(r.title)+'"><span class="'+(opts.step?'stack-number':'status-dot '+r.status)+'">'+(opts.step?opts.step:'')+'</span><span class="review-copy"><span class="review-title">'+esc(r.title)+'</span><span class="review-meta">'+(opts.project?'<span class="repo-name">'+projectBy(r.project).name+'</span><span>·</span>':'')+'<span>'+(r.number?'#'+r.number:'Branch')+'</span><span>·</span><span class="review-status '+r.status+'">'+statusNames[r.status]+'</span></span></span>'+(r.pinned&&!opts.step?icon('pin','review-pin'):'')+'</button>';}
function projectSwitcher(){let p=projectBy(state.project);return '<button class="project-switcher" data-action="projects"><span class="project-avatar">'+p.initial+'</span><span class="project-detail"><strong>'+p.name+'</strong><small>'+reviewCount(projectReviews(p.id).length)+'</small></span>'+icon('down')+'</button>';}
function queryInput(){return '<label class="sidebar-query">'+icon('search')+'<input id="side-query" placeholder="Find a review…" aria-label="Find a review in this sidebar" value="'+esc(state.query)+'"></label>';}
function matches(r){return (r.title+' '+r.number+' '+projectBy(r.project).name).toLowerCase().includes(state.query.toLowerCase());}
function filteredProject(){return projectReviews(state.project).filter(matches).filter(r=>state.filter==='all'||r.status===state.filter||state.filter==='attention'&&(r.status==='new'||r.status==='updated'));}
function filters(){return '<div class="filter-row" aria-label="Filter project reviews">'+[['all','All'],['attention','Needs review'],['progress','In progress'],['done','Done']].map(pair=>'<button data-action="filter" data-id="'+pair[0]+'" aria-pressed="'+(state.filter===pair[0])+'">'+pair[1]+'</button>').join('')+'</div>';}
function listOrEmpty(list,opts){return list.length?list.map(r=>row(r,opts)).join(''):'<p class="empty">No reviews in this view.</p>';}
function VariantA(){
return '<div class="side-top">'+brand()+newReview()+searchButton()+button('inbox','Review inbox <span class="count">'+attention().length+' need review</span>','inbox')+'</div><div class="side-scroll"><div class="section-label">Projects '+button('add','','plus','icon-btn','aria-label="Add project"')+'</div>'+projects.map(p=>{let list=projectReviews(p.id);let open=state.expanded.has(p.id);let shown=state.showAll.has(p.id)?list:list.slice(0,4);return '<button class="project-heading" data-action="expand" data-id="'+p.id+'" aria-expanded="'+open+'">'+icon(open?'down':'chevron','chevron')+icon('folder')+'<span class="name">'+p.name+'</span><span class="unit">'+reviewCount(list.length)+'</span></button>'+(open?'<div class="project-reviews">'+listOrEmpty(shown)+(list.length>4?'<button class="more-link" data-action="show-all" data-id="'+p.id+'">'+(state.showAll.has(p.id)?'Show fewer':'Show all '+reviewCount(list.length)+'')+'</button>':'')+'</div>':'');}).join('')+'</div>'+foot();
}
function VariantB(){let list=filteredProject();return '<div class="side-top">'+brand()+projectSwitcher()+newReview()+queryInput()+filters()+'</div><div class="side-scroll"><div class="project-intro"><strong>Pull requests & branches</strong><span>'+reviewCount(list.length)+'</span></div>'+listOrEmpty(list)+'</div>'+foot();}
function VariantC(){let all=visibleReviews().filter(r=>state.scope==='all'||r.project===state.scope);let rows=all.filter(r=>state.queue==='all'||r.status===state.queue||state.queue==='attention'&&(r.status==='new'||r.status==='updated')).filter(matches);return '<div class="side-top">'+brand()+newReview()+'<div class="queue-links">'+[['attention','Needs review','inbox'],['progress','In progress','clock'],['done','Done','check']].map(item=>{let n=all.filter(r=>r.status===item[0]||item[0]==='attention'&&(r.status==='new'||r.status==='updated')).length;return '<button class="nav-item '+(state.queue===item[0]?'selected':'')+'" data-action="queue" data-id="'+item[0]+'">'+icon(item[2])+item[1]+'<span class="count">'+reviewCount(n)+'</span></button>';}).join('')+'</div><select id="queue-scope" class="queue-project-select" aria-label="Queue project scope"><option value="all">All projects</option>'+projects.map(p=>'<option value="'+p.id+'" '+(state.scope===p.id?'selected':'')+'>'+p.name+'</option>').join('')+'</select>'+queryInput()+'</div><div class="side-scroll"><div class="section-label">'+(state.queue==='attention'?'Ready for your attention':state.queue==='progress'?'Continue where you left off':state.queue==='done'?'Completed reviews':'All reviews')+'<span>'+rows.length+'</span></div>'+listOrEmpty(rows,{queue:true,project:true})+'</div>'+foot();}
function VariantD(){let p=projectBy(state.project);return '<nav class="project-rail" aria-label="Project rail">'+icon('logo','trace-mark')+button('collapse','','panel','icon-btn','aria-label="Toggle review drawer" title="Toggle review drawer (⌘B)"')+button('inbox','','inbox','icon-btn','title="Review inbox" aria-label="Review inbox"')+'<div class="divider" style="width:25px;margin:2px 0"></div>'+projects.map(pr=>'<button class="rail-btn '+(state.project===pr.id?'active':'')+'" data-action="project" data-id="'+pr.id+'" title="'+pr.name+'" aria-label="Open project '+pr.name+'" '+(state.project===pr.id?'aria-current="true"':'')+'>'+pr.initial+'</button>').join('')+button('add','','plus','icon-btn','aria-label="Add project" title="Add project"')+button('settings','','settings','icon-btn rail-bottom','aria-label="Settings" title="Settings"')+'</nav><div class="rail-pane"><div class="side-top"><div class="rail-title"><strong>'+p.name+'</strong>'+button('collapse','','panel','icon-btn','aria-label="Collapse sidebar" title="Collapse sidebar (⌘B)"')+'</div>'+newReview()+queryInput()+'<div class="rail-subnav"><button class="active" data-action="rail-reviews">Reviews · '+projectReviews(p.id).length+'</button><button data-action="activity" title="2 requests waiting across all projects">All activity</button></div></div><div class="side-scroll"><div class="section-label">Pull requests & branches</div>'+listOrEmpty(projectReviews(p.id).filter(matches))+'</div><footer class="side-foot">'+button('projects','All projects','folder')+'<div class="foot-tools">'+button('help','','help','icon-btn','aria-label="Help" title="Help"')+button('import','','upload','icon-btn','aria-label="Import a report" title="Import a report"')+'<span class="spacer"></span>'+button('archive','Archive','','quiet')+'</div></footer></div>';}
function VariantE(){let list=projectReviews(state.project);let isStack=state.project==='strat';return '<div class="side-top">'+brand()+projectSwitcher()+newReview()+searchButton()+'</div><div class="side-scroll"><div class="section-label">'+(isStack?'Review stacks':'Independent reviews')+'<span>'+reviewCount(list.length)+'</span></div>'+(isStack?'<div class="stack-card"><button class="stack-title" data-action="stack" aria-expanded="'+state.stackOpen+'">'+icon('layers')+'Multi TP/SL'+icon(state.stackOpen?'down':'chevron')+'</button><p class="stack-meta">'+list.length+' PRs · '+list.filter(r=>r.status==='done').length+' done · illustrative stack</p></div>':'')+(state.stackOpen||!isStack?'<div class="'+(isStack?'stack-timeline':'')+'">'+(isStack?'<div class="stack-base">base / main</div>':'')+list.map((r,i)=>row(r,isStack?{step:String(i+1).padStart(2,'0')}:{})).join('')+'</div>':'')+'<p class="stack-note">'+(isStack?'Start at the base and work upward through the feature. Named stacks are a proposed addition.':'Reviews without a stack stay available here.')+'</p>'+button('projects','Switch project','folder')+'</div>'+foot();}
const variantViews={A:VariantA,B:VariantB,C:VariantC,D:VariantD,E:VariantE};
function codeRow(n,body,cls=''){return '<div class="code-line '+cls+'"><span class="ln">'+n+'</span><span>'+body+'</span></div>';}
function diffView(r){let lines=[['1','<span class="keyword">const</span> PREFIX = <span class="string">"strat"</span>'],['2',''],['3','<span class="keyword">export const</span> LOCAL_STORAGE_KEYS = {'],['4','  TERMS: {'],['5','    ACCEPTED: <span class="string">PREFIX + ":terms:accepted"</span>,'],['6','  },'],['7',''],['8','  PREFERENCES: {'],['9','    THEME: <span class="string">PREFIX + ":theme"</span>,'],['10','  },'],['11','};']];
let before=lines.map(x=>codeRow(x[0],x[1])).join('');let after=lines.slice(0,9).map(x=>codeRow(x[0],x[1])).join('')+codeRow('10','    TPSL_GAIN_UNIT: <span class="string">PREFIX + ":tpsl:gain-unit"</span>,','added')+codeRow('11','  },')+codeRow('12','};');
return '<div class="file-top">'+icon('file')+'<code title="'+r.file+'">'+r.file+'</code><small>1 of '+r.files+' files</small></div><div class="file-tldr"><b>'+r.why+'</b> '+(r.id==='331'?'A namespaced preference keeps the TP and SL controls in the same unit.':'Select another review in the sidebar to compare navigation.')+'</div><div class="diff"><div class="diff-half"><div class="diff-label">BASE · before</div>'+before+'</div><div class="diff-half"><div class="diff-label">HEAD · '+r.hash+'</div>'+after+'</div></div><div class="diff-foot">'+icon('file')+'Representative code preview · focus of this study is navigation</div>';
}
function mainBody(r){
if(state.section==='overview')return '<section class="context-card"><div class="eyebrow">The review at a glance</div><h3>'+r.summary+'</h3><p>This workspace stays the same across all five variants. Use the sidebar to switch reviews, then use Reports above to choose an individual report snapshot.</p></section><div class="metrics"><div><b>'+r.files+'</b><small>changed files</small></div><div><b>'+r.journeys+'</b><small>user journeys</small></div><div><b>'+r.reviewed+'/'+r.files+'</b><small>files reviewed</small></div></div>';
if(state.section==='journeys')return '<div class="context-card"><div class="eyebrow">Main journey · illustrative</div><h3>'+r.summary+'</h3><p>Why this matters · Follow the behavior affected by this review, from the user’s starting action to its result.</p></div><div class="steps"><div class="step"><small>01 · START</small><p>Select an order to configure.</p></div><div class="step"><small>02 · ACTION</small><p>Enter a target and choose its unit.</p></div><div class="step"><small>03 · OUTCOME</small><p>Validate and submit the intended price.</p></div></div>';
if(state.section==='findings')return '<div class="finding-card"><span class="severity">ILLUSTRATIVE FINDINGS VIEW</span><h3>'+r.findings+' '+(r.findings===1?'finding':'findings')+' in this sample review</h3><p>A review’s status in the sidebar is your progress through the report. Finding severity belongs here, separately from New, Updated, In progress, or Done.</p></div>';
return diffView(r);
}
function renderMain(){let r=selected(),p=projectBy(r.project);document.getElementById('main').innerHTML='<div class="content-top">'+(state.collapsed?button('collapse','','panel','icon-btn','aria-label="Show sidebar" title="Show sidebar (⌘B)"'):'')+'<div class="breadcrumb"><span>'+p.name+'</span><span>/</span><span>'+(r.number?'PR #'+r.number:'Branch review')+'</span></div>'+button('reports','Reports · '+r.reports+' '+icon('down'),'clock','snapshot-button','title="Choose a report snapshot"')+button('primer','','book','icon-btn','aria-label="Project primer" title="Project primer"')+'</div><header class="review-head"><div class="review-heading"><span class="pr-badge">'+(r.number?'PR #'+r.number:'Branch')+'</span><h2 title="'+esc(r.title)+'">'+esc(r.title)+'</h2><span class="spacer"></span>'+button('review-menu','','more','icon-btn','aria-label="Review actions" title="Review actions"')+button('done','<span>'+(r.status==='done'?'Reopen':'Mark done')+'</span>','check','outline','aria-label="'+(r.status==='done'?'Reopen review':'Mark review done')+'" title="Personal review status"')+'</div><div class="branchline"><span>main</span><span>←</span>'+icon('branch')+'<span class="branch" title="'+esc(r.branch)+'">'+esc(r.branch)+'</span></div><nav class="section-tabs" aria-label="Review sections">'+[['overview','Overview','overview',null],['files','Files','file',r.files],['journeys','User journeys','branch',r.journeys],['findings','Findings','flag',r.findings]].map(t=>'<button data-action="section" data-id="'+t[0]+'" class="'+(state.section===t[0]?'active':'')+'" '+(state.section===t[0]?'aria-current="page"':'')+'>'+icon(t[2])+t[1]+(t[3]!==null?'<span class="tab-count">'+t[3]+'</span>':'')+'</button>').join('')+'<span class="progress">'+r.reviewed+'/'+r.files+' files reviewed</span></nav></header><div class="content-scroll">'+mainBody(r)+'</div><footer class="statusbar"><span class="status-dot done"></span><span>Local review workspace</span><span>'+(state.snapshot==='latest'?'Latest report · '+r.hash:'Earlier sample report · illustrative code')+'</span></footer>';}
function render(){let focus=document.activeElement?.id,cursor=focus==='side-query'?document.activeElement.selectionStart:null;document.getElementById('sidebar').dataset.variant=state.variant;document.getElementById('sidebar').hidden=state.collapsed&&state.variant!=='D';document.getElementById('sidebar').classList.toggle('rail-only',state.collapsed&&state.variant==='D');document.getElementById('sidebar').innerHTML=variantViews[state.variant]();let d=designs[state.variant];document.getElementById('caption').innerHTML='<div><h1>'+state.variant+' / '+d.name+'</h1><p>'+d.desc+'</p></div><span class="recommendation">'+d.tag+'</span>';renderMain();document.getElementById('dock').innerHTML='<button class="arrow" data-action="previous" aria-label="Previous design">'+icon('back')+'</button><span class="current-design"><small>Design variant</small>'+state.variant+' — '+d.name+'</span><span class="dock-divider"></span>'+keys.map(k=>'<button class="design-tab" data-action="variant" data-id="'+k+'" aria-pressed="'+(state.variant===k)+'" title="'+k+' — '+designs[k].name+'">'+k+'</button>').join('')+'<button class="arrow" data-action="next" aria-label="Next design">'+icon('arrow')+'</button><span class="dock-divider"></span><button class="compare" data-action="compare">Compare all</button>';if(focus==='side-query'){let el=document.getElementById(focus);if(el){el.focus();el.setSelectionRange(cursor,cursor)}}}
function switchVariant(key){state.variant=key;state.query='';state.filter='all';state.project=selected().project;state.expanded.add(state.project);if(projectReviews(state.project).findIndex(r=>r.id===state.selected)>=4)state.showAll.add(state.project);state.queue=selected().status==='new'||selected().status==='updated'?'attention':selected().status;state.scope='all';state.collapsed=false;let u=new URL(location.href);u.searchParams.set('variant',key);history.replaceState(null,'',u);render();revealSelected();}
function openReview(id,reveal=true){state.selected=id;state.project=selected().project;state.expanded.add(state.project);state.snapshot='latest';state.stackOpen=true;if(projectReviews(state.project).findIndex(r=>r.id===id)>=4)state.showAll.add(state.project);if(reveal){state.query='';state.filter='all';state.queue=selected().status==='new'||selected().status==='updated'?'attention':selected().status;if(state.scope!=='all'&&state.scope!==state.project)state.scope='all'}if(document.getElementById('dialog').open)document.getElementById('dialog').close();render();if(reveal)revealSelected();}
function revealSelected(){document.querySelector('#sidebar .review-row[aria-current="page"]')?.scrollIntoView({block:'nearest',inline:'nearest'})}
let toastTimer;
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200)}
function modal(title,body){document.getElementById('dialog-content').innerHTML='<header class="dialog-head"><h2>'+title+'</h2>'+button('close','','close','icon-btn','aria-label="Close dialog"')+'</header><div class="dialog-body">'+body+'</div>';let d=document.getElementById('dialog');if(!d.open)d.showModal();}
function reviewPicker(list){return list.map(r=>'<button class="dialog-row" data-action="review" data-id="'+r.id+'"><span class="status-dot '+r.status+'"></span><span><strong>'+esc(r.title)+'</strong><small>'+projectBy(r.project).name+' · '+(r.number?'#'+r.number:'Branch review')+'</small></span><span class="right">'+statusNames[r.status]+'</span></button>').join('');}
function projectDialog(){modal('Switch project','<p>Each project holds its PR and branch reviews.</p><div class="dialog-list">'+projects.map(p=>'<button class="dialog-row" data-action="project" data-id="'+p.id+'"><span class="project-avatar">'+p.initial+'</span><span><strong>'+p.name+'</strong><small>'+p.description+'</small></span><span class="right">'+reviewCount(projectReviews(p.id).length)+'</span></button>').join('')+'</div><div class="dialog-actions">'+button('add','Add project','plus')+'</div>');}
function action(name,id){
if(name==='variant')return switchVariant(id);
if(name==='next'||name==='previous')return switchVariant(keys[(keys.indexOf(state.variant)+(name==='next'?1:4))%5]);
if(name==='collapse'){state.collapsed=!state.collapsed;render();return}
if(name==='review')return openReview(id,document.getElementById('dialog').open);
if(name==='expand'){state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render();return}
if(name==='show-all'){state.showAll.has(id)?state.showAll.delete(id):state.showAll.add(id);render();return}
if(name==='filter'){state.filter=id;render();return}
if(name==='queue'){state.queue=id;render();return}
if(name==='section'){state.section=id;renderMain();return}
if(name==='stack'){state.stackOpen=!state.stackOpen;render();return}
if(name==='project'){state.project=id;state.filter='all';state.query='';state.expanded.add(id);let first=projectReviews(id)[0];if(first)openReview(first.id);else{document.getElementById('dialog').close();render()}return}
if(name==='projects')return projectDialog();
if(name==='close'){document.getElementById('dialog').close();return}
if(name==='rail-reviews'){state.filter='all';render();return}
if(name==='inbox')return modal('Review inbox','<p>'+attention().length+' reviews need attention across your projects. “Updated” means an unread report snapshot, not necessarily new GitHub commits.</p><div class="dialog-list">'+reviewPicker(attention())+'</div>');
if(name==='reports'){let r=selected();return modal('Reports for '+(r.number?'PR #'+r.number:'this branch'),'<p>One review in the sidebar. Every report snapshot stays available here.</p><div class="dialog-list">'+Array.from({length:r.reports},(_,i)=>'<button class="dialog-row" data-action="snapshot" data-id="'+(i?'older-'+i:'latest')+'">'+icon('file')+'<span><strong>'+(i?'Earlier report':'Latest report')+'</strong><small>'+ (i?'Sep '+(28-i)+' · earlier commit':'Sep 28 · '+r.hash)+'</small></span><span class="right '+((i?'older-'+i:'latest')===state.snapshot?'active':'')+'">'+((i?'older-'+i:'latest')===state.snapshot?'Viewing':'Open')+'</span></button>').join('')+'</div><p class="dialog-note">Snapshot switching is simulated. Code shown is representative.</p>')}
if(name==='snapshot'){state.snapshot=id;document.getElementById('dialog').close();renderMain();toast('Previewing '+(id==='latest'?'the latest':'an earlier')+' report. No native state changed.');return}
if(name==='search'){modal('Find a review','<input class="dialog-search" id="global-query" autofocus placeholder="Search titles, PR numbers, or projects…" aria-label="Search all reviews"><div class="dialog-list" id="search-results">'+reviewPicker(visibleReviews())+'</div>');document.getElementById('global-query').focus();return}
if(name==='activity')return modal('Agent activity','<p>Request tracking stays separate from review progress. Waiting for a report does not mean Trace can see the agent running.</p><div class="dialog-list"><div class="dialog-row">'+icon('clock')+'<span><strong>TP/SL trading commands</strong><small>strat-web-app · PR #333 · Codex handoff</small></span><span class="request-status">Waiting for report</span></div><div class="dialog-row">'+icon('clock')+'<span><strong>Persist auto-sign preference</strong><small>interwovenkit · PR #261 · Claude handoff</small></span><span class="request-status">Waiting for report</span></div><button class="dialog-row" data-action="review" data-id="338">'+icon('check')+'<span><strong>Edit TP/SL from chart lines</strong><small>Report detected · open review</small></span><span class="right active">Ready</span></button></div><p class="dialog-note">Illustrative request activity. No CLI is running from this prototype.</p>');
if(name==='new')return modal('New review','<p>Start with a project and a PR. Stack discovery and model selection belong in this composer.</p><label for="new-project">Project</label><select id="new-project">'+projects.map(p=>'<option '+(p.id===state.project?'selected':'')+'>'+p.name+'</option>').join('')+'</select><label for="new-pr">Pull request</label><input id="new-pr" placeholder="Paste a PR URL or enter a number"><div class="dialog-actions">'+button('import','Import a report instead','upload')+'</div>'+button('preview-request','Preview request','arrow','new-review')+'<p class="dialog-note">Prototype only. This does not contact GitHub or start an agent.</p>');
if(name==='preview-request'){document.getElementById('dialog').close();toast('Composer preview complete. No report or agent request was created.');return}
if(name==='import')return modal('Import a report','<p>Bring an existing .trace.json report into its project. Import is available from New review and the sidebar utility controls.</p><div class="context-card"><strong>report.trace.json</strong><p>Trace validates its structure and source references before importing.</p></div>'+button('close','Back to the prototype','','outline')+'<p class="dialog-note">File import is illustrated here; this prototype does not read or upload files.</p>');
if(name==='settings')return modal('Settings','<label for="modal-theme">Appearance</label><select id="modal-theme">'+['light','dark','system'].map(t=>'<option value="'+t+'" '+(state.theme===t?'selected':'')+'>'+t[0].toUpperCase()+t.slice(1)+'</option>').join('')+'</select><div class="dialog-list" style="margin-top:16px"><div class="dialog-row"><span>Toggle sidebar</span><span class="right">⌘B</span></div><div class="dialog-row"><span>Search reviews</span><span class="right">⌘K</span></div><div class="dialog-row"><span>New review</span><span class="right">⌘N</span></div><div class="dialog-row"><span>Compare designs</span><span class="right">← / →</span></div></div><p class="dialog-note">Appearance applies only to this preview. No settings persist after reload.</p>');
if(name==='help'||name==='guide')return modal('A quieter place to navigate','<p>The existing sidebar mixes requests, reviews, and report history. These variants use one row per PR or branch, and keep each level distinct.</p><div class="dialog-list"><div class="dialog-row">'+icon('folder')+'<span><strong>Projects contain reviews</strong><small>Every count says what it counts.</small></span></div><div class="dialog-row">'+icon('file')+'<span><strong>Reviews contain report snapshots</strong><small>Open Reports in the top-right corner for history.</small></span></div><div class="dialog-row">'+icon('clock')+'<span><strong>Agent activity tracks requests</strong><small>It does not duplicate the review list.</small></span></div></div><p style="margin-top:16px">Try switching projects, opening a PR, choosing a report snapshot, searching with ⌘K, and collapsing the sidebar with ⌘B.</p><div class="dialog-actions">'+button('new','Create a review','plus')+button('import','Import a report','upload')+'</div>');
if(name==='primer')return modal(projectBy(selected().project).name+' · Project primer','<p>Project explanations live with the selected project or review, instead of occupying a permanent global navigation row.</p><div class="dialog-row"><span><strong>TP / SL</strong><small>Take-profit and stop-loss targets attached to an order.</small></span></div><p class="dialog-note">Representative context for this design study.</p>');
if(name==='compare')return modal('Five ways to find your next review','<p><strong>Recommendation: A — Project library.</strong> It preserves the project model while removing the most confusing layer. Choose E if stack order becomes the dominant workflow.</p><table class="compare-table"><thead><tr><th>Direction</th><th>What it helps</th><th>Tradeoff</th></tr></thead><tbody>'+keys.map(k=>'<tr><td>'+k+' · '+designs[k].name+'</td><td>'+designs[k].benefit+'</td><td>'+designs[k].tradeoff+'</td></tr>').join('')+'</tbody></table><p class="dialog-note">Design recommendation, not a measured usability result. E needs saved stack metadata before production use.</p>');
if(name==='review-menu')return modal('Review actions','<div class="dialog-list">'+button('pin',selected().pinned?'Unpin review':'Pin review','pin','dialog-row')+button('archive-current','Archive review','archive','dialog-row')+button('reports','View report snapshots','clock','dialog-row')+button('primer','Project primer','book','dialog-row')+'</div><p class="dialog-note">Changes affect this preview only. Done and Archived are personal organization, not GitHub approval or merge status.</p>');
if(name==='pin'){selected().pinned=!selected().pinned;document.getElementById('dialog').close();render();toast('Pin updated in this preview.');return}
if(name==='done'){selected().status=selected().status==='done'?'progress':'done';render();toast('Personal review status changed in this preview.');return}
if(name==='archive-current'){state.archived.add(state.selected);let next=visibleReviews()[0];document.getElementById('dialog').close();if(next)openReview(next.id);else render();toast('Review archived in this preview. Restore it from Archived.');return}
if(name==='archive')return modal('Archived reviews',state.archived.size?'<div class="dialog-list">'+reviews.filter(r=>state.archived.has(r.id)).map(r=>'<button class="dialog-row" data-action="restore" data-id="'+r.id+'"><span><strong>'+r.title+'</strong><small>'+projectBy(r.project).name+'</small></span><span class="right active">Restore</span></button>').join('')+'</div>':'<p>No archived reviews in this preview. Open a review’s action menu to try archiving and restoring it.</p>');
if(name==='restore'){state.archived.delete(id);openReview(id);toast('Review restored in this preview.');return}
if(name==='add')return modal('Add a project','<p>Connect a local repository or worktree. The production app stores reports under the project and keeps source access local.</p><label for="project-path">Repository path</label><input id="project-path" placeholder="/Users/you/Projects/repository">'+button('preview-project','Preview connection','folder','new-review')+'<p class="dialog-note">This is a navigation prototype. No folder will be opened or connected.</p>');
if(name==='preview-project'){document.getElementById('dialog').close();toast('Project connection simulated. No folders were accessed.');return}
}
function theme(value){state.theme=value;document.documentElement.dataset.theme=value==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):value;document.getElementById('theme').value=value}
document.addEventListener('click',event=>{let target=event.target.closest('[data-action]');if(target)action(target.dataset.action,target.dataset.id)});
document.addEventListener('input',event=>{if(event.target.id==='side-query'){state.query=event.target.value;render()}if(event.target.id==='global-query'){let q=event.target.value.toLowerCase();document.getElementById('search-results').innerHTML=reviewPicker(visibleReviews().filter(r=>(r.title+' '+r.number+' '+projectBy(r.project).name).toLowerCase().includes(q)))||'<p>No matching reviews.</p>'}});
document.addEventListener('change',event=>{if(event.target.id==='theme'||event.target.id==='modal-theme')theme(event.target.value);if(event.target.id==='queue-scope'){state.scope=event.target.value;render()}});
document.addEventListener('keydown',event=>{let typing=event.target.closest('input,textarea,select,[contenteditable]');if(document.getElementById('dialog').open)return;if(event.metaKey||event.ctrlKey){if(event.key.toLowerCase()==='b'){event.preventDefault();action('collapse')}else if(event.key.toLowerCase()==='k'){event.preventDefault();action('search')}else if(event.key.toLowerCase()==='n'){event.preventDefault();action('new')}return}if(!typing&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){event.preventDefault();action(event.key==='ArrowRight'?'next':'previous')}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')theme('system')});
render();
</script>
</body>
</html>
